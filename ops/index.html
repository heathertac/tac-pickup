<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C1814">
<title>TAC OPS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
<div id="app">

  <div id="auth-screen" class="screen" style="display:flex;">
    <div class="auth-wrap">
      <div class="auth-logo">
        <div class="wordmark">TAC <span>OPS</span></div>
        <div class="wordmark-sub">The Afterschool Collective</div>
      </div>
      <div class="auth-card">
        <div class="auth-title">Sign in to continue</div>
        <div class="auth-sub">Access is restricted to TAC team members.</div>
        <button class="google-btn" id="google-sign-in">
          <svg width="16" height="16" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
        <div class="auth-divider">or sign in with email</div>
        <div class="auth-field-group">
          <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
          <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
          <button class="email-btn" id="email-sign-in">Sign in</button>
        </div>
        <div id="auth-error" class="auth-error"></div>
      </div>
    </div>
  </div>

  <div id="app-screen" class="screen" style="display:none;">
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <div class="wordmark">TAC <span>OPS</span></div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-user" id="sidebar-user"></div>
      </aside>
      <main class="main-area" id="main-area">
        <div class="main-content" id="main-content">
          <div class="loading-state">
            <div class="spinner"></div>
            <div class="loading-text">Loading your dashboard...</div>
          </div>
        </div>
      </main>
    </div>
    <div class="notes-panel" id="notes-panel">
      <div class="notes-header">
        <div class="notes-title">My notes</div>
        <div class="notes-meta" id="notes-meta">Private to you</div>
        <button class="notes-close" id="notes-close" aria-label="Close notes">&#x2715;</button>
      </div>
      <textarea class="notes-body" id="notes-body" placeholder="Type anything here — notes are private to you and auto-save as you type."></textarea>
    </div>
    <div class="mobile-nav" id="mobile-nav"></div>
  </div>

</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
