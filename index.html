<script>
/* ------------------------------------------------------------------
   TEST MODE
   Turned on ONLY by adding ?testdate=YYYY-MM-DD to the app URL.
   With no parameter, every line below is inert and the app runs live.
   When on: the date is pretended, a striped black banner is pinned to
   the top, storage is isolated from real days, all parent texts are
   redirected to Heather, and nothing is logged to Airtable.
------------------------------------------------------------------ */
const TEST_DATE=(function(){
try{
const m=String(location.search||'').match(/[?&]testdate=(\d{4}-\d{2}-\d{2})/);
return m?m[1]:null;
}catch(e){return null;}
})();

const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ------------------------------------------------------------------
   WHICH DAY ARE WE LOOKING AT
   The app opens on today. The arrows in the header move the view to
   another date so you can check what is coming or what happened.
   Any day that is not today is READ ONLY: no ticking, no texts, no
   notes. Marking a child picked up on the wrong date, or texting a
   parent from tomorrow's roster, must not be one stray tap away.
------------------------------------------------------------------ */
function isoOf(d){
const p=function(n){return(n<10?'0':'')+n;};
return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function dateFromIso(iso){
const p=String(iso).split('-');
return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
}
const HOME_ISO=TEST_DATE||isoOf(new Date());
let viewIso=HOME_ISO;
function viewDate(){return dateFromIso(viewIso);}
function isHomeDay(){return viewIso===HOME_ISO;}
function readOnly(){return !isHomeDay();}
function dayFull(){return DAYS_FULL[viewDate().getDay()];}
function dayStr(){const d=viewDate();return MONTHS[d.getMonth()]+' '+d.getDate();}
function keySuffix(){return(TEST_DATE?'test_':'')+viewIso;}
function cacheKey(){return'tac_roster_v8_'+keySuffix();}
function stateKey(){return'tac_states_v3_'+keySuffix();}
const REBECCA_PHONE='7705471075';
const LOGO_URL='https://static.wixstatic.com/media/7e1448_415a7686f7774d038fce84f0816a76b2~mv2.png/v1/fill/w_320,h_125,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/ASC%20LOGO.png';

const INSTRUCTOR_PHOTO_CACHE={};
function instrList(s){
if(s&&Array.isArray(s.instructors)&&s.instructors.length)return s.instructors;
if(s&&s.instructorName)return[{name:s.instructorName,photoUrl:s.instructorPhotoUrl||null}];
return[];
}
function getInstrPhoto(name){if(!name)return null;return INSTRUCTOR_PHOTO_CACHE[name]||null;}
function buildPhotoCache(){roster.forEach(function(s){instrList(s).forEach(function(i){if(i.name&&i.photoUrl)INSTRUCTOR_PHOTO_CACHE[i.name]=i.photoUrl;});});}

let roster=[],locations=[],changes=[],activeFilter='all',isOffline=false,urgentStudentId=null;
let noPickupToday=[];
let closedReason='';
let selected={};
let expanded={};
let openStops={};
let trayOpen=false;
let undoTimer=null;
let st=loadState();

function loadState(){
const empty={states:{},absentNotes:{},teamNotes:{},pickupTimes:{},textsSent:{},textOpened:{},selected:{}};
try{
const s=localStorage.getItem(stateKey());
if(!s)return empty;
const p=JSON.parse(s);
return{
states:p.states||{},
absentNotes:p.absentNotes||{},
teamNotes:p.teamNotes||{},
pickupTimes:p.pickupTimes||{},
textsSent:p.textsSent||{},
textOpened:p.textOpened||{},
selected:p.selected||{}
};
}catch(e){return empty;}
}
function saveState(){try{localStorage.setItem(stateKey(),JSON.stringify({states:states,absentNotes:absentNotes,teamNotes:teamNotes,pickupTimes:pickupTimes,textsSent:textsSent,textOpened:textOpened,selected:selected}));}catch(e){}}
selected=st.selected||{};


/* ------------------------------------------------------------------
   OUTBOX — a note is never reported as sent until it actually lands.
   Notes are queued to localStorage first, then delivered. A failed
   delivery keeps retrying (every 20s, on reconnect, on app focus) and
   shows a red state until it succeeds. Nothing here can silently vanish.
------------------------------------------------------------------ */
const OUTBOX_KEY='tac_outbox_v1_'+(TEST_DATE?'test_':'')+HOME_ISO;
let outbox=loadOutbox();
let flushing=false;

function loadOutbox(){try{const s=localStorage.getItem(OUTBOX_KEY);const p=s?JSON.parse(s):[];return Array.isArray(p)?p:[];}catch(e){return [];}}
function saveOutbox(){try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(outbox));}catch(e){}}
function newQid(){return 'q'+Date.now()+Math.random().toString(36).slice(2,7);}

function queueIncident(qid,kind,studentId,payload){
outbox.push({qid:qid,kind:kind,studentId:studentId,payload:payload,attempts:0});
saveOutbox();
}

function noteRecord(kind,studentId){
if(kind==='absent')return absentNotes[studentId];
if(kind==='team')return teamNotes[studentId];
return null;
}

async function postIncident(payload){
const p=Object.assign({},payload);
if(TEST_DATE)p.testdate=TEST_DATE;
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
if(!r.ok)throw new Error('HTTP '+r.status);
const j=await r.json();
if(j&&j.error)throw new Error(String(j.error));
return j;
}

async function flushOutbox(){
if(flushing||!outbox.length)return;
flushing=true;
const items=outbox.slice();
for(let i=0;i<items.length;i++){
const item=items[i];
try{
await postIncident(item.payload);
item.delivered=true;
const rec=noteRecord(item.kind,item.studentId);
if(rec&&rec.qid===item.qid)rec.status='sent';
}catch(e){
item.attempts=(item.attempts||0)+1;
const rec=noteRecord(item.kind,item.studentId);
if(rec&&rec.qid===item.qid)rec.status='failed';
}
}
outbox=outbox.filter(function(x){return !x.delivered;});
saveOutbox();saveState();render();
flushing=false;
}

function retryOutbox(){
outbox.forEach(function(x){
const rec=noteRecord(x.kind,x.studentId);
if(rec&&rec.qid===x.qid)rec.status='queued';
});
saveState();render();
flushOutbox();
}

setInterval(flushOutbox,20000);
window.addEventListener('online',flushOutbox);
document.addEventListener('visibilitychange',function(){if(!document.hidden)flushOutbox();});

function renderNoteStatus(rec,label){
if(!rec||!rec.qid)return '';
if(rec.status==='sent')return '<div class="note-status sent"><i class="ti ti-circle-check" style="font-size:14px"></i> '+label+' delivered to the team</div>';
if(rec.status==='failed')return '<div class="note-failed-box"><div class="note-failed-title"><i class="ti ti-alert-triangle" style="font-size:14px"></i> NOT SENT YET</div><div class="note-failed-sub">'+label+' has not reached the team. Still retrying automatically \u2014 it will send as soon as you have signal.</div><button class="note-retry" onclick="retryOutbox()">Try now</button></div>';
return '<div class="note-status queued"><i class="ti ti-clock" style="font-size:14px"></i> Sending '+label.toLowerCase()+'\u2026</div>';
}

function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(n){return String(n||'').split(' ').slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();}
function parseSecondary(n){if(!n)return null;const m=String(n).match(/Also text[^\d]*?([\w\s]+?)\s+at\s+([\d\-\(\)\s]+)/i);if(!m)return null;return{name:m[1].trim().replace(/^(Dad|Mom|dad|mom)\s+/,''),phone:m[2].trim()};}
function firstName(n){return String(n||'').split(' ')[0];}
function hasPhone(s){return!!String(s.pickupPhone||'').replace(/\D/g,'');}
function nowTime(){return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}

function getInstructors(){
const seen={};const out=[];
roster.forEach(function(s){instrList(s).forEach(function(i){if(i.name&&!seen[i.name]){seen[i.name]=1;out.push(i.name);}});});
return out.sort();
}
function todayList(){
let list=roster.slice();
if(activeFilter!=='all')list=list.filter(function(s){return instrList(s).some(function(i){return i.name===activeFilter;});});
return list;
}

function parsePickupTime(t){
if(!t)return 9999;
const m=String(t).toLowerCase().match(/(\d+):(\d+)\s*(am|pm)?/);
if(!m)return 9999;
let h=parseInt(m[1],10);const min=parseInt(m[2],10);
const ap=m[3]||'pm';
if(ap==='pm'&&h<12)h+=12;
if(ap==='am'&&h===12)h=0;
return h*60+min;
}

function locInfo(id){
const l=locations.find(function(x){return x.id===id;});
if(!l)return{name:'',time:'',type:''};
const f=l.fields||{};
return{name:f['Name']||'',time:f['Default Bus Arrival Time']||'',type:(f['Type']&&f['Type'].name)||f['Type']||''};
}
function isDropoffStop(s){
const info=locInfo(s.pickupLocationId);
return info.type==='Studio'||info.type==='Drop-Off'||String(info.name).toLowerCase().indexOf('steam lab')>-1;
}
function isSchoolStop(locId){return locInfo(locId).type==='School';}
function stopName(s){const info=locInfo(s.pickupLocationId);return info.name||'Unassigned location';}

function groupByLocation(list){
const groups={};
list.forEach(function(s){
const locId=s.pickupLocationId||'__none__';
const info=locInfo(locId);
if(!groups[locId])groups[locId]={id:locId,name:info.name||'No pickup location set',time:info.time,type:info.type,students:[]};
groups[locId].students.push(s);
});
Object.keys(groups).forEach(function(k){
groups[k].students.sort(function(a,b){return String(a.studentName).localeCompare(String(b.studentName));});
});
return Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){
if(a.id==='__none__')return 1;
if(b.id==='__none__')return -1;
return parsePickupTime(a.time)-parsePickupTime(b.time);
});
}

async function proxy(action,extra){
const payload=Object.assign({action:action},extra||{});
if(TEST_DATE)payload.testdate=TEST_DATE;
else if(viewIso!==HOME_ISO||true)payload.viewdate=viewIso;
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
return r.json();
}

function stateOf(id){
if(noPickupToday.indexOf(id)>-1&&!states[id])return 'nopickup';
return states[id]||'pending';
}
function isSelectable(id){return stateOf(id)==='pending';}

function toggleSelect(id){
if(readOnly())return;
if(!isSelectable(id))return;
if(selected[id])delete selected[id];else selected[id]=true;
render();
}
function stopPendingIds(g){
return g.students.filter(function(s){return isSelectable(s.studentId);}).map(function(s){return s.studentId;});
}
function stopSelectedIds(g){
return stopPendingIds(g).filter(function(id){return selected[id];});
}
function toggleSelectAll(locId){
if(readOnly())return;
const g=groupByLocation(todayList()).find(function(x){return x.id===locId;});
if(!g)return;
const pend=stopPendingIds(g);
const allOn=pend.length>0&&pend.every(function(id){return selected[id];});
pend.forEach(function(id){if(allOn)delete selected[id];else selected[id]=true;});
render();
}
function toggleExpand(id){
if(expanded[id])delete expanded[id];else expanded[id]=true;
render();
}
function toggleStopOpen(locId){
if(openStops[locId])delete openStops[locId];else openStops[locId]=true;
render();
}

function markPickedUp(ids){
if(readOnly())return;
if(!ids.length)return;
const t=nowTime();
ids.forEach(function(id){
states[id]='done';
pickupTimes[id]=t;
delete selected[id];
delete expanded[id];
});
saveState();render();
showUndoToast(ids);
}
function markStop(locId){
const g=groupByLocation(todayList()).find(function(x){return x.id===locId;});
if(!g)return;
markPickedUp(stopSelectedIds(g));
}
function markOne(id){markPickedUp([id]);}

function showUndoToast(ids){
clearTimeout(undoTimer);
const old=document.getElementById('undoToast');
if(old)old.remove();
const el=document.createElement('div');
el.className='undo-toast';
el.id='undoToast';
const label=ids.length===1?'1 child marked picked up':ids.length+' children marked picked up';
el.innerHTML='<span>'+label+'</span><button class="undo-toast-btn" onclick="undoPickup()">Undo</button><div class="undo-toast-bar"></div>';
document.body.appendChild(el);
window.__undoIds=ids.slice();
undoTimer=setTimeout(function(){el.remove();window.__undoIds=null;},5000);
}
function undoPickup(){
clearTimeout(undoTimer);
const el=document.getElementById('undoToast');
if(el)el.remove();
const ids=window.__undoIds||[];
ids.forEach(function(id){
delete states[id];
delete pickupTimes[id];
delete textsSent[id];
delete textOpened[id];
selected[id]=true;
});
window.__undoIds=null;
saveState();render();
}

function setAbsent(id){
if(readOnly())return;
states[id]='absent';
delete selected[id];
delete pickupTimes[id];
delete textsSent[id];
delete textOpened[id];
absentNotes[id]=absentNotes[id]||{sent:false};
expanded[id]=true;

function undoAbsent(id){

closedReason='';

function sendParentText(s){
const parentFirst=firstName(s.pickupName);
const greeting=parentFirst?'Hi '+parentFirst+'!':'Hi there!';
const kid=firstName(s.studentName);
let body;
if(isDropoffStop(s)||s.parentDropoff){
body=greeting+' '+kid+' has arrived safely at The Afterschool Collective and is checked in. See you at pickup time!';
}else{
body=greeting+' '+kid+' has been safely picked up and is on the way back to the studio. See you at pickup time!';
}
if(TEST_DATE)body='[TEST — ignore] '+body;
const phone=String(s.pickupPhone||'').replace(/\D/g,'');
const url=(phone?'sms:'+phone:'sms:')+'?body='+encodeURIComponent(body);
const a=document.createElement('a');
a.href=url;
a.style.display='none';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}

const qid=newQid();

function saveCache(data){try{sessionStorage.setItem(cacheKey(),JSON.stringify({ts:Date.now(),data:data}));}catch(e){}}
function loadCache(){try{const c=sessionStorage.getItem(cacheKey());if(c){const p=JSON.parse(c);if(Date.now()-p.ts<8*3600000)return p.data;}}catch(e){}return null;}

function renderRow(s,g){
const id=s.studentId;
const state=stateOf(id);
const sel=!!selected[id];
const isOpen=!!expanded[id];
const schoolStop=isSchoolStop(g.id);
const staffHere=instrList(s);
const showInstr=staffHere.length&&activeFilter==='all'&&state==='pending';
let boxHtml,rowCls,avCls,metaHtml;

if(state==='nopickup'){
boxHtml='<div class="kbox-static" style="color:#94A3B8"><i class="ti ti-calendar-off"></i></div>';
rowCls='nopickup';avCls='absent';
metaHtml='<div class="kmeta absent">No pickup needed today</div>';
}else if(state==='done'){
boxHtml='<div class="kbox-static" style="color:#2E7D32"><i class="ti ti-circle-check"></i></div>';
rowCls='done';avCls='done';
const sent=textsSent[id];
const noph=!hasPhone(s);
metaHtml='<div class="kmeta done">Picked up'+(pickupTimes[id]?' '+esc(pickupTimes[id]):'')+'</div>'+
(noph?'<div class="kmeta">No phone on file</div>':sent?'<div class="kmeta done">Parent texted '+esc(sent)+'</div>':'<div class="kmeta warn">Parent not texted yet</div>');
}else if(state==='absent'){
boxHtml='<div class="kbox-static" style="color:#64748B"><i class="ti ti-user-x"></i></div>';
rowCls='absent';avCls='absent';
const anr=absentNotes[id]||{};
const anTxt=anr.status==='sent'?'Marked absent, note delivered':anr.status==='failed'?'Marked absent, NOTE NOT SENT':anr.status==='queued'?'Marked absent, note sending\u2026':'Marked absent';
metaHtml='<div class="kmeta '+(anr.status==='failed'?'warn':'absent')+'">'+anTxt+'</div>';
}else{
boxHtml=readOnly()
?'<div class="kbox-static" style="color:#CBD5E1"><i class="ti ti-point"></i></div>'
:'<button class="kbox" onclick="toggleSelect(\''+id+'\')" aria-label="Select '+esc(s.studentName)+'"><div class="kbox-inner'+(sel?' on':'')+'">'+(sel?'<i class="ti ti-check"></i>':'')+'</div></button>';
rowCls=sel?'sel':'';avCls=sel?'sel':'';
const chips=[];
if(s.school&&String(g.name||'').toLowerCase().indexOf(String(s.school).toLowerCase())===-1)chips.push('<div class="school-chip"><i class="ti ti-building" style="font-size:11px"></i>'+esc(s.school)+'</div>');

let html='<div class="krow '+rowCls+'">'+boxHtml+

'<div class="kinfo"><div class="kname">'+esc(s.studentName)+'</div>'+metaHtml+'</div>'+

function renderStop(g){
const total=g.students.filter(function(s){return stateOf(s.studentId)!=='nopickup';}).length;
const doneCount=g.students.filter(function(s){return stateOf(s.studentId)==='done';}).length;
const openCount=g.students.filter(function(s){return stateOf(s.studentId)==='pending';}).length;
const complete=total>0&&openCount===0;
const icon=(g.type==='Studio'||g.type==='Drop-Off')?'building':g.type==='School'?'school':'bus';

if(complete&&!openStops[g.id]){
return '<div class="stop-collapsed" onclick="toggleStopOpen(\''+g.id+'\')">'+
'<i class="ti ti-circle-check" style="font-size:20px;color:#2E7D32"></i>'+
'<div class="stop-collapsed-name">'+esc(g.name)+'<div class="stop-collapsed-sub">'+doneCount+' picked up'+(total-doneCount>0?', '+(total-doneCount)+' absent':'')+'</div></div>'+
'<i class="ti ti-chevron-down" style="font-size:20px;color:#2E7D32"></i></div>';
}

const selIds=stopSelectedIds(g);
const pend=stopPendingIds(g);
const allOn=pend.length>0&&pend.every(function(id){return selected[id];});
const dropoff=g.type==='Studio'||g.type==='Drop-Off';
const foot=(!readOnly()&&selIds.length)
?'<div class="stop-foot"><button class="btn-stop-go" onclick="markStop(\''+g.id+'\')">'+(dropoff?selIds.length+' arrived — check in':'I have '+selIds.length+(selIds.length===1?' kid':' kids'))+'</button></div>'
:'';

return '<div class="stop">'+
'<div class="stop-hdr"><div class="stop-hdr-icon"><i class="ti ti-'+icon+'"></i></div>'+
'<div class="stop-hdr-text"><div class="stop-hdr-name">'+esc(g.name)+'</div>'+(g.time?'<div class="stop-hdr-time">'+esc(g.time)+'</div>':'')+'</div>'+
'<div class="stop-hdr-count">'+(doneCount===0?total+(total===1?' kid':' kids'):doneCount+' of '+total+' done')+'</div></div>'+
(pend.length>1&&!readOnly()?'<div class="select-bar"><button class="select-all" onclick="toggleSelectAll(\''+g.id+'\')"><i class="ti ti-'+(allOn?'square-off':'checkbox')+'" style="font-size:18px"></i> '+(allOn?'Clear selection':'Select all here')+'</button><div class="select-count">'+(selIds.length?selIds.length+' selected':'none selected')+'</div></div>':'')+
g.students.map(function(s){return renderRow(s,g);}).join('')+
foot+
'</div>';
}

function renderTray(){
const host=document.getElementById('trayHost');
if(!trayOpen){host.innerHTML='';return;}
const pending=pendingTextIds();
const sentIds=Object.keys(textsSent).filter(function(id){return roster.some(function(s){return s.studentId===id;});});
const noPhone=noPhoneDoneIds();
const absentIds=roster.filter(function(s){return states[s.studentId]==='absent';}).map(function(s){return s.studentId;});
function row(id,kind){
const s=roster.find(function(x){return x.studentId===id;});
if(!s)return '';
if(kind==='pending'){
if(textOpened[id]){
return '<div class="tray-row"><div class="tray-info"><div class="tray-name">'+esc(s.studentName)+'</div><div class="tray-meta">'+esc(s.pickupName||'Parent')+' · '+esc(stopName(s))+'</div></div></div>'+
'<div class="confirm-box"><div class="confirm-q">Did that text actually send?</div><div class="confirm-row">'+
'<button class="btn-yes" onclick="confirmTextSent(\''+id+'\')">Yes, sent</button>'+
'<button class="btn-no" onclick="cancelTextSent(\''+id+'\')">Not yet</button></div></div>';
}
return '<div class="tray-row"><div class="tray-info"><div class="tray-name">'+esc(s.studentName)+'</div><div class="tray-meta">'+esc(s.pickupName||'Parent')+' · '+esc(stopName(s))+'</div></div>'+
'<button class="btn-text" onclick="openTextFor(\''+id+'\')">Text</button></div>';
}
if(kind==='sent'){
return '<div class="tray-row sent"><div class="tray-info"><div class="tray-name">'+esc(s.studentName)+'</div><div class="tray-meta done">Sent '+esc(textsSent[id])+'</div></div><i class="ti ti-circle-check" style="font-size:20px;color:#2E7D32"></i></div>';
}
if(kind==='nophone'){
return '<div class="tray-row muted"><div class="tray-info"><div class="tray-name">'+esc(s.studentName)+'</div><div class="tray-meta">No phone on file — not counted</div></div><button class="btn-text off">Text</button></div>';
}
return '<div class="tray-row muted"><div class="tray-info"><div class="tray-name">'+esc(s.studentName)+'</div><div class="tray-meta">Marked absent — no text owed</div></div><i class="ti ti-user-x" style="font-size:19px;color:#64748B"></i></div>';
}
host.innerHTML='<div class="tray">'+
'<div class="tray-hdr"><button class="tray-back" onclick="closeTray()" aria-label="Back"><i class="ti ti-chevron-left"></i></button>'+
'<div><div class="tray-title">Text parents</div><div class="tray-sub">'+pending.length+' left · '+sentIds.length+' sent</div></div></div>'+
(TEST_DATE?'<div class="tray-test"><i class="ti ti-flask" style="font-size:17px;color:#FFD54F"></i> TEST MODE — every text below goes to your own phone, not to a family.</div>':'')+
'<div class="tray-note"><i class="ti ti-photo" style="font-size:17px"></i> Attach a photo in Messages first if you\'re sending one today.</div>'+
(pending.length?pending.map(function(id){return row(id,'pending');}).join(''):'<div class="tray-empty">Every parent has been texted.</div>')+
noPhone.map(function(id){return row(id,'nophone');}).join('')+
sentIds.map(function(id){return row(id,'sent');}).join('')+
absentIds.map(function(id){return row(id,'absent');}).join('')+
'</div>';
}

function render(){
const list=todayList();
const doneCount=roster.filter(function(s){return states[s.studentId]==='done';}).length;
const absentCount=roster.filter(function(s){return states[s.studentId]==='absent';}).length;
const normalTotal=roster.length;
const noPickupCount=roster.filter(function(s){return noPickupToday.indexOf(s.studentId)>-1;}).length;
const expectedToday=normalTotal-noPickupCount;
const todayChanges=changes.filter(function(c){return(c.fields||{})['Change Summary'];});
const instructors=getInstructors();
const needText=pendingTextIds().length;
const stillOut=roster.filter(function(s){return stateOf(s.studentId)==='pending';}).length;

document.getElementById('app').innerHTML=
(TEST_DATE?'<div class="test-bar"><i class="ti ti-flask test-bar-icon"></i><div><div class="test-bar-main">Test mode — not today\'s roster</div><div class="test-bar-sub">Pretending it is '+dayFull()+', '+dayStr()+'. All texts go to your phone. Nothing is logged.</div></div></div>':'')+
(isOffline?'<div class="offline-bar"><i class="ti ti-wifi-off"></i> Offline — showing cached roster</div>':'')+
(outbox.length?'<div class="outbox-bar"><div class="outbox-text"><i class="ti ti-alert-triangle" style="font-size:17px"></i> '+outbox.length+(outbox.length===1?' note has':' notes have')+' not reached the team</div><button class="outbox-btn" onclick="retryOutbox()">Try again</button></div>':'')+
'<div class="header">'+
'<img src="'+LOGO_URL+'" class="header-logo" alt="Afterschool Collective" onerror="this.style.display=\'none\'">'+
'<div class="datenav">'+
'<button class="datenav-arrow" onclick="stepDay(-1)" aria-label="Previous day">\u2039</button>'+
'<button class="datenav-label'+(isHomeDay()?'':' away')+'" onclick="goHome()" aria-label="Back to today">'+
'<div class="datenav-day">'+dayFull()+'</div><div class="datenav-date">'+dayStr()+(isHomeDay()?'':' \u00b7 not today')+'</div></button>'+
'<button class="datenav-arrow" onclick="stepDay(1)" aria-label="Next day">\u203a</button>'+
'</div>'+
'</div>'+
'<a href="tel:'+REBECCA_PHONE+'" class="emergency-bar"><i class="ti ti-phone" style="font-size:13px"></i> Emergency: Rebecca (770) 547-1075</a>'+
(readOnly()?'<div class="away-bar"><div class="away-text"><i class="ti ti-eye" style="font-size:17px"></i> Looking ahead \u2014 view only</div><button class="away-btn" onclick="goHome()">Back to today</button></div>':'')+
(needText&&!readOnly()?'<div class="nag-bar"><div class="nag-text"><i class="ti ti-message-2" style="font-size:17px"></i> '+needText+(needText===1?' parent still needs a text':' parents still need a text')+'</div><button class="nag-btn" onclick="openTray()">Send now</button></div>':'')+
'<div class="stats">'+
'<div class="stat"><div class="stat-n '+(stillOut>0?'red':'green')+'">'+stillOut+'</div><div class="stat-l">Still out of '+expectedToday+(noPickupCount>0?' ('+noPickupCount+' not in today)':'')+'</div></div>'+
'<div class="stat"><div class="stat-n green">'+doneCount+'</div><div class="stat-l">Picked up</div></div>'+
'<div class="stat"><div class="stat-n '+(absentCount>0?'red':'')+'">'+absentCount+'</div><div class="stat-l">Absent</div></div>'+
'</div>'+
(todayChanges.length?'<div class="alert-box"><div class="alert-hdr"><i class="ti ti-alert-triangle" style="font-size:16px;color:#A32D2D"></i><span class="alert-hdr-text">Changes today, read first</span></div>'+todayChanges.map(function(c){return'<div class="alert-item"><div class="alert-name">'+esc((c.fields||{})['Change Summary']||'Change logged')+'</div></div>';}).join('')+'</div>':'<div class="clear-bar"><i class="ti ti-circle-check" style="font-size:16px;color:#2E7D32"></i><span class="clear-text">All clear, no changes today</span></div>')+
(instructors.length?'<div class="filter-bar"><button class="filter-pill'+(activeFilter==='all'?' active':'')+'" onclick="setFilter(\'all\')"><i class="ti ti-users" style="font-size:13px"></i> All</button>'+instructors.map(function(name){
const photo=getInstrPhoto(name);
return'<button class="filter-pill'+(activeFilter===name?' active':'')+'" onclick="setFilter(\''+name.replace(/'/g,"\\'")+'\')">'+(photo?'<img src="'+esc(photo)+'" alt="">':'')+esc(firstName(name))+'</button>';
}).join('')+'</div>':'')+
'<div class="section-hdr"><span class="section-title">'+(activeFilter==='all'?"Today's stops":esc(firstName(activeFilter))+"'s stops")+'</span><span class="count-chip">'+groupByLocation(list).length+'</span></div>'+
'<div class="stops">'+
(list.length===0?'<div class="closed-note">'+esc(closedReason||('No students enrolled for '+dayFull()))+'</div>':groupByLocation(list).map(renderStop).join(''))+
'</div>';

renderTray();
}

async function loadDay(){
const cached=loadCache();
if(cached){
roster=cached.roster||[];locations=cached.locations||[];changes=cached.changes||[];noPickupToday=cached.noPickupToday||[];
buildPhotoCache();isOffline=false;render();
}
try{
const res=await Promise.all([proxy('getTodayRoster'),proxy('getLocations'),proxy('getChanges')]);
roster=res[0].roster||[];
closedReason=res[0].closedReason||'';
locations=res[1].records||[];
changes=res[2].records||[];
noPickupToday=res[2].noPickupStudentIds||[];
buildPhotoCache();
saveCache({roster:roster,locations:locations,changes:changes,noPickupToday:noPickupToday});
isOffline=false;
}catch(e){
if(!cached){isOffline=true;roster=[];locations=[];changes=[];}
else isOffline=true;
}
render();
}

loadDay();
</script>
</body>
</html>
