let students=[],changes=[],activeFilter='all',isOffline=false,urgentStudentId=null;

// Persisted state
function loadPersistedState(){
  try{const s=localStorage.getItem(STATE_KEY);return s?JSON.parse(s):{states:{},absentNotes:{},teamNotes:{}};}
  catch(e){return{states:{},absentNotes:{},teamNotes:{}};}
}
function savePersistedState(){
  try{localStorage.setItem(STATE_KEY,JSON.stringify({states,absentNotes,teamNotes}));}catch(e){}
}
let {states,absentNotes,teamNotes}=loadPersistedState();

function initials(n){return(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function normDay(d){const s=(d||'').toLowerCase();if(s.startsWith('mo'))return'mon';if(s.startsWith('tu'))return'tue';if(s.startsWith('we'))return'wed';if(s.startsWith('th'))return'thu';if(s.startsWith('fr'))return'fri';return s.slice(0,3);}

function parseSecondary(n){
  if(!n)return null;
  const m=n.match(/Also text[^\d]*?([\w\s]+?)\s+at\s+([\d\-\(\)\s]+)/i);
  if(!m)return null;
  return{name:m[1].trim().replace(/^(Dad|Mom|dad|mom)\s+/,''),phone:m[2].trim()};
}

function todayList(){
  const t=normDay(todayShort);
  let list=students.filter(s=>{
    const days=(s.days||[]).map(d=>normDay(d.name||d));
    return days.includes(t)&&(s.status||'').toLowerCase().includes('active');
  });
  if(activeFilter!=='all')list=list.filter(s=>s.instrName===activeFilter);
  return list;
}

function getInstructors(){
  const t=normDay(todayShort);
  return students.filter(s=>s.instrName&&(s.instrDays||[]).map(d=>normDay(d.name||d)).includes(t)).map(s=>s.instrName).filter((v,i,a)=>a.indexOf(v)===i).sort();
}

function openSMS(phone,name,studentName,type){
  const greeting=name?`Hi ${name}!`:'Hi there!';
  const body=type==='done'
    ?`${greeting} ${studentName} has been safely picked up and is on the way to the STEAM Lab. We'll see you at pickup time!`
    :`${greeting} This is your instructor from The Afterschool Collective — I'm on my way to pick up ${studentName} right now. See you soon!`;
  const p=(phone||'').replace(/\D/g,'');
  window.open((p?`sms:${p}`:'sms:')+`?body=${encodeURIComponent(body)}`,'_self');
}

function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}
function loadCache(){try{const c=sessionStorage.getItem(CACHE_KEY);if(c){const p=JSON.parse(c);if(Date.now()-p.ts<8*3600000)return p.data;}}catch(e){}return null;}

async function callAirtable(prompt){
  try{
    const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system:'Data relay. Return ONLY raw JSON, no markdown.',messages:[{role:'user',content:prompt}],mcp_servers:[{type:'url',url:'https://mcp.airtable.com/mcp',name:'airtable'}]})});
    const d=await r.json();
    for(const b of(d.content||[])){if(b.type==='mcp_tool_result'){try{const p=JSON.parse(b.content?.[0]?.text||'');if(p.records)return p.records;}catch{}}}
    const txt=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    try{const p=JSON.parse(txt);if(p.records)return p.records;if(Array.isArray(p))return p;}catch{}
  }catch(e){}return null;
}

function setst(id,s){
  states[id]=s;
  if(s==='absent'){absentNotes[id]=absentNotes[id]||{open:true,sent:false};}
  savePersistedState();render();
}
function setFilter(f){activeFilter=f;render();}

function toggleAbsentNote(id){
  absentNotes[id]=absentNotes[id]||{};
  absentNotes[id].open=!absentNotes[id].open;
  savePersistedState();render();
}

async function sendAbsentNote(id){
  const s=students.find(x=>x.id===id);
  const el=document.getElementById(`absent-${id}`);
  const text=el?el.value.trim():'';
  if(!text)return;
  absentNotes[id]={sent:true,open:false};
  savePersistedState();render();
  await callAirtable(`Create a record in Airtable base ${BASE} table tblBrZKAPGrg893o1 with fields: Description "ABSENT — ${s?.name||id}: ${text} [${todayStr}]", Type "Field Note", Severity "Low".`);
}

function toggleTeamNote(id){
  teamNotes[id]=teamNotes[id]||{};
  teamNotes[id].open=!teamNotes[id].open;
  savePersistedState();render();
}

async function sendTeamNote(id){
  const s=students.find(x=>x.id===id);
  const el=document.getElementById(`note-${id}`);
  const text=el?el.value.trim():'';
  if(!text)return;
  teamNotes[id]={sent:true,open:false};
  savePersistedState();render();
  await callAirtable(`Create a record in Airtable base ${BASE} table tblBrZKAPGrg893o1 with fields: Description "${text} [Student: ${s?.name||id}, Date: ${todayStr}]", Type "Field Note", Severity "Low".`);
}

function openUrgent(id){
  const s=students.find(x=>x.id===id);
  urgentStudentId=id;
  document.getElementById('urgentSub').textContent=`Student: ${s?.name||''}`;
  document.getElementById('urgentText').value='';
  document.getElementById('urgentOverlay').style.display='flex';
}
function closeUrgent(e){if(e.target.id==='urgentOverlay')closeUrgentSheet();}
function closeUrgentSheet(){document.getElementById('urgentOverlay').style.display='none';urgentStudentId=null;}
async function sendUrgent(){
  const text=document.getElementById('urgentText').value.trim();
  const s=students.find(x=>x.id===urgentStudentId);
  closeUrgentSheet();
  const msg=`🚨 URGENT — ${s?.name||'Student'} situation at pickup. ${text} [${todayStr}]`;
  window.open(`sms:${REBECCA_PHONE}?body=${encodeURIComponent(msg)}`,'_self');
  await callAirtable(`Create a record in Airtable base ${BASE} table tblBrZKAPGrg893o1 with fields: Description "${msg}", Type "Missing Student", Severity "High".`);
}

function render(){
  const list=todayList();
  const allToday=students.filter(s=>{const t=normDay(todayShort);const days=(s.days||[]).map(d=>normDay(d.name||d));return days.includes(t)&&(s.status||'').toLowerCase().includes('active');});
  const doneCount=Object.values(states).filter(s=>s==='done').length;
  const absentCount=Object.values(states).filter(s=>s==='absent').length;
  const todayChanges=changes.filter(c=>{const f=c.cellValuesByFieldId||c.fields||{};return f.fldQ6hdzA6AWLPuDC;});
  const instructors=getInstructors();

  document.getElementById('app').innerHTML=`
  ${isOffline?`<div class="offline-bar"><i class="ti ti-wifi-off"></i> Offline — showing cached roster</div>`:''}
  <div class="header">
    <div>
      <div class="brand-name">AFTERSCHOOL</div>
      <div class="brand-sub">Collective</div>
      <div class="brand-tag">Pickup — ${todayStr}</div>
    </div>
    <div class="day-pill">${todayFull}</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-n">${allToday.length}</div><div class="stat-l">Expected</div></div>
    <div class="stat"><div class="stat-n green">${doneCount}</div><div class="stat-l">Picked up</div></div>
    <div class="stat"><div class="stat-n ${absentCount>0?'red':''}">${absentCount}</div><div class="stat-l">Absent</div></div>
  </div>
  ${todayChanges.length?`
  <div class="alert-box" style="margin:12px 16px 0">
    <div class="alert-hdr"><i class="ti ti-alert-triangle" style="font-size:16px;color:#A32D2D"></i><span class="alert-hdr-text">Changes today — read first</span></div>
    ${todayChanges.map(c=>{const f=c.cellValuesByFieldId||c.fields||{};return`<div class="alert-item"><div class="alert-name">${f.fldQ6hdzA6AWLPuDC||'Change logged'}</div>${f.fldtCI7bXXnnZJyDG?.name?`<div class="alert-detail">${f.fldtCI7bXXnnZJyDG.name} change</div>`:''}</div>`;}).join('')}
  </div>`:`
  <div class="clear-bar"><i class="ti ti-circle-check" style="font-size:16px;color:#27500A"></i><span class="clear-text">All clear — no changes today</span></div>`}
  ${instructors.length>1?`
  <div class="filter-bar">
    <button class="filter-pill${activeFilter==='all'?' active':''}" onclick="setFilter('all')"><i class="ti ti-users" style="font-size:13px"></i> All</button>
    ${instructors.map(name=>`<button class="filter-pill${activeFilter===name?' active':''}" onclick="setFilter('${name.replace(/'/g,"\\'")}')">${INSTRUCTOR_PHOTOS[name]?`<img src="${INSTRUCTOR_PHOTOS[name]}" alt="${name}" onerror="this.style.display='none'">`:''}${name.split(' ')[0]}</button>`).join('')}
  </div>`:'' }
  <div class="section-hdr">
    <span class="section-title">${activeFilter==='all'?"Today's students":activeFilter.split(' ')[0]+"'s students"}</span>
    <span class="count-chip">${list.length}</span>
  </div>
  <div class="cards">
  ${list.length===0?`<div style="text-align:center;padding:40px 0;color:#888;font-size:14px">No students enrolled for ${todayFull}</div>`:
  list.map(s=>{
    const st=states[s.id]||'pending';
    const secondary=parseSecondary(s.notes);
    const instrPhoto=INSTRUCTOR_PHOTOS[s.instrName]||null;
    const smsType=st==='done'?'done':'enroute';
    const an=absentNotes[s.id]||{};
    const tn=teamNotes[s.id]||{};
    const schoolLine=s.school||'';
    const teacherLine=s.teacher?`${s.teacher}${s.grade?' · '+s.grade:''}`:s.grade||'';
    const locationLine=s.pickupLocation?`${s.pickupLocation}${s.busTime?' · '+s.busTime:''}`:s.busTime||'';
    const now=new Date();
    const timeStr=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

    return`<div class="card ${st}" id="c-${s.id}">
      <div class="card-accent ${st}"></div>
      <div class="card-top">
        <div class="av ${st}">${s.photo?`<img src="${s.photo}" alt="${s.name}" onerror="this.style.display='none';this.parentNode.textContent='${initials(s.name)}'">`:initials(s.name)}</div>
        <div style="flex:1;min-width:0">
          <div class="sname">${s.name}</div>
          <div class="sstatus"><div class="sdot ${st}"></div>${st==='pending'?'Not started yet':st==='enroute'?'En route to pickup':st==='absent'?'Marked absent':'Picked up safely'}</div>
          <div class="info-row">
            ${locationLine?`<div class="location-chip"><i class="ti ti-map-pin" style="font-size:11px"></i>${locationLine}</div>`:''}
            ${schoolLine?`<div class="school-chip"><i class="ti ti-building" style="font-size:11px"></i>${schoolLine}</div>`:''}
          </div>
          ${teacherLine?`<div class="teacher-line">${teacherLine}</div>`:''}
        </div>
        ${instrPhoto&&activeFilter==='all'?`<div class="instr-chip"><img src="${instrPhoto}" class="instr-photo" alt="${s.instrName||''}" onerror="this.style.display='none'"><span class="instr-name">${(s.instrName||'').split(' ')[0]}</span></div>`:''}
      </div>
      ${st!=='absent'?`<div class="parent-row">
        <div class="parent-contacts">
          <div class="parent-contact">
            <div>
              <div class="parent-name">${s.pickupName||'Parent'}</div>
              ${s.pickupPhone?`<div class="parent-phone">${s.pickupPhone}</div>`:`<div class="no-phone">Awaiting welcome email reply</div>`}
            </div>
            ${s.pickupPhone?`<button class="btn-sms" onclick="openSMS('${s.pickupPhone}','${(s.pickupName||'').replace(/'/g,"\\'")}','${s.name.replace(/'/g,"\\'")}','${smsType}')"><i class="ti ti-message" style="font-size:13px"></i> Text</button>`:''}
          </div>
          ${secondary?`<div class="parent-contact">
            <div>
              <div class="parent-name">${secondary.name}</div>
              <div class="parent-phone">${secondary.phone}</div>
            </div>
            <button class="btn-sms secondary" onclick="openSMS('${secondary.phone}','${secondary.name.replace(/'/g,"\\'")}','${s.name.replace(/'/g,"\\'")}','${smsType}')"><i class="ti ti-message" style="font-size:13px"></i> Text</button>
          </div>`:''}
        </div>
      </div>`:''}
      <div class="card-actions">
        ${st==='pending'?`<button class="btn-action btn-enroute" onclick="setst('${s.id}','enroute')"><i class="ti ti-walk" style="font-size:15px"></i>En route to pickup</button>`
        :st==='enroute'?`
          <button class="btn-action btn-picked" onclick="setst('${s.id}','done')"><i class="ti ti-check" style="font-size:15px"></i>Child picked up</button>
          <button class="btn-action btn-absent" onclick="setst('${s.id}','absent')" style="max-width:110px"><i class="ti ti-user-x" style="font-size:14px"></i>Not there</button>`
        :st==='absent'?`<button class="btn-action btn-absent-done" disabled><i class="ti ti-user-x" style="font-size:14px"></i>Marked absent</button>`
        :`<button class="btn-action btn-complete" disabled><i class="ti ti-circle-check" style="font-size:15px"></i>Complete</button>`}
      </div>
      ${st==='absent'?`
      <div class="absent-note">
        <div class="absent-note-label"><i class="ti ti-pencil" style="font-size:12px"></i> What happened?</div>
        ${an.sent?`<div style="font-size:12px;color:#64748B;display:flex;align-items:center;gap:5px;padding:4px 0"><i class="ti ti-circle-check" style="font-size:13px"></i> Note sent to the team</div>`
        :`<textarea class="absent-input" id="absent-${s.id}" rows="2" placeholder="${s.name} was not at pickup at ${timeStr}. "></textarea>
        <div class="absent-actions">
          <button class="btn-absent-send" onclick="sendAbsentNote('${s.id}')"><i class="ti ti-send" style="font-size:13px"></i> Send to team</button>
        </div>`}
        <div style="margin-top:8px">
          <button class="urgent-link" onclick="openUrgent('${s.id}')"><i class="ti ti-alert-triangle" style="font-size:13px"></i> This is urgent — send an alert</button>
        </div>
      </div>`:''}
      ${st==='done'?`
      <div class="post-pickup">
        ${tn.sent?`<div class="note-sent"><i class="ti ti-circle-check" style="font-size:14px;color:#27500A"></i> Note sent to the team</div>`
        :tn.open?`<div class="note-form">
          <textarea class="note-input" id="note-${s.id}" rows="2" placeholder="e.g. Bus arrived 10 min late at a new stop on 47th Ave"></textarea>
          <div class="note-row">
            <button class="btn-note-cancel" onclick="toggleTeamNote('${s.id}')">Cancel</button>
            <button class="btn-note-send" onclick="sendTeamNote('${s.id}')"><i class="ti ti-send" style="font-size:13px"></i> Send to team</button>
          </div>
        </div>`
        :`<button class="note-btn" onclick="toggleTeamNote('${s.id}')"><i class="ti ti-pencil" style="font-size:13px"></i> Leave a note for the team</button>`}
        <button class="urgent-link" onclick="openUrgent('${s.id}')"><i class="ti ti-alert-triangle" style="font-size:13px"></i> Send an urgent alert</button>
      </div>`:''}
    </div>`;
  }).join('')}
  </div>`;
}

async function init(){
  const cached=loadCache();
  if(cached){students=cached.students;changes=cached.changes;isOffline=false;render();}
  const raw=await callAirtable(`Fetch all records from Airtable base ${BASE} table tblJSQjtxq7yc29cY. Return JSON with id and fields: fldSxrnb5OVFoTXea (name), fldCg5jyD4lNtmXS6 (status), fldqiZE6x6xmkfTp6 (days), fldS1uncWbXSUnMjQ (photo), fldNrNE405tkGrmh8 (pickupPhone), fldXOFfMJuj4xK4YA (pickupName), fldYTfbphzjOJLDZE (notes), fldTYrtOCYNOuGB1M (teacher), fldFbfzsmGPPBUAP3 (grade), fldYKQp60pwoB7YFr (school), fldQVHtMRmpemPtZE (pickupLocation).`);
  if(raw){
    const staffRaw=await callAirtable(`Fetch all records from Airtable base ${BASE} table tblWuCldxuiPhtUUC. Return JSON with id and fields: fldpTZVDA2K7wAfKq (name), fldR41zcrl85iKLBq (days), fldQZZW5GuC6EMl6A (status).`);
    const staff=(staffRaw||[]).filter(r=>(r.cellValuesByFieldId?.fldQZZW5GuC6EMl6A?.name||'').toLowerCase().includes('active'));
    const t=normDay(todayShort);
    students=raw.map(r=>{
      const f=r.cellValuesByFieldId||{};
      const photos=f.fldS1uncWbXSUnMjQ||[];
      const studentDays=(f.fldqiZE6x6xmkfTp6||[]).map(d=>normDay(d.name||d));
      const matchedInstr=staff.find(st=>{
        const sd=(st.cellValuesByFieldId?.fldR41zcrl85iKLBq||[]).map(d=>normDay(d.name||d));
        return sd.includes(t)&&studentDays.includes(t);
      });
      const pickupLocs=f.fldQVHtMRmpemPtZE||[];
      const pickupLocation=pickupLocs[0]?.name||'';
      return{
        id:r.id,
        name:f.fldSxrnb5OVFoTXea||'Unknown',
        status:f.fldCg5jyD4lNtmXS6?.name||'Active',
        days:f.fldqiZE6x6xmkfTp6||[],
        photo:photos[0]?.thumbnails?.small?.url||photos[0]?.url||null,
        pickupPhone:f.fldNrNE405tkGrmh8||'',
        pickupName:f.fldXOFfMJuj4xK4YA||'',
        notes:f.fldYTfbphzjOJLDZE||'',
        teacher:f.fldTYrtOCYNOuGB1M||'',
        grade:f.fldFbfzsmGPPBUAP3?.name||'',
        school:f.fldYKQp60pwoB7YFr?.name||'',
        pickupLocation,
        instrName:matchedInstr?.cellValuesByFieldId?.fldpTZVDA2K7wAfKq||'',
        instrDays:matchedInstr?.cellValuesByFieldId?.fldR41zcrl85iKLBq||[],
      };
    });
    const rawC=await callAirtable(`Fetch all records from Airtable base ${BASE} table tblEdgjx4phKSj4wS. Return full JSON.`);
    changes=rawC||[];
    saveCache({students,changes});
    isOffline=false;
  }else if(!cached){isOffline=true;students=[];changes=[];}
  else{isOffline=true;}
  render();
}
init();
</script>
</body>
</html>
