<!DOCTYPE html>
<html lang="en">
<head>

<title>TAC Pickup</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;}
.app{max-width:420px;margin:0 auto;background:#fff;min-height:100vh;}
.header{background:#fff;border-bottom:3px solid #F4600C;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.brand-name{font-size:16px;font-weight:600;color:#1a1a1a;letter-spacing:-0.3px;line-height:1;}
.brand-sub{font-size:9px;letter-spacing:0.22em;color:#1a1a1a;text-transform:uppercase;margin-top:1px;}
.brand-tag{font-size:11px;color:#F4600C;margin-top:3px;}
.day-pill{background:#FEE8DC;color:#C44A06;font-size:12px;font-weight:500;padding:5px 14px;border-radius:999px;border:1px solid #F4A27C;white-space:nowrap;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 0;}
.stat{background:#f5f5f5;border-radius:8px;padding:10px 12px;}
.stat-n{font-size:22px;font-weight:600;color:#1a1a1a;}
.stat-n.green{color:#27500A;}
.stat-n.red{color:#C0392B;}
.stat-l{font-size:10px;color:#888;margin-top:2px;}
.alert-box{margin:12px 16px 0;border-radius:12px;overflow:hidden;border:1px solid #F09595;}
.alert-hdr{background:#FCEBEB;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.alert-hdr-text{font-size:12px;font-weight:600;color:#A32D2D;}
.alert-item{background:#fff;border-top:1px solid #F09595;padding:10px 14px;}
.alert-name{font-size:14px;font-weight:500;color:#1a1a1a;}
.clear-bar{margin:12px 16px 0;background:#EAF3DE;border:1px solid #97C459;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:8px;}
.clear-text{font-size:13px;color:#27500A;font-weight:500;}
.filter-bar{padding:12px 16px 0;display:flex;gap:6px;flex-wrap:wrap;}
.filter-pill{background:#f5f5f5;border:1px solid #ddd;color:#666;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.filter-pill.active{background:#FEE8DC;border-color:#F4A27C;color:#7A2800;}
.filter-pill img{width:20px;height:20px;border-radius:50%;object-fit:cover;}
.section-hdr{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.section-title{font-size:12px;font-weight:600;color:#C44A06;letter-spacing:0.05em;text-transform:uppercase;}
.count-chip{font-size:11px;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:999px;}
.cards{padding:0 16px 80px;display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;}
.card.enroute{border-color:#EF9F27;background:#FFFBF0;}
.card.done{border-color:#97C459;background:#F0F8E8;}
.card.absent{border-color:#94A3B8;background:#F8FAFC;opacity:0.95;}
.card-accent{height:3px;background:#F4600C;}
.card-accent.enroute{background:#EF9F27;}
.card-accent.done{background:#97C459;}
.card-accent.absent{background:#94A3B8;}
.card-top{padding:14px 14px 10px;display:flex;align-items:center;gap:12px;}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0;overflow:hidden;border:2px solid #F4A27C;background:#FEE8DC;color:#7A2800;}
.av.small{width:40px;height:40px;font-size:14px;}
.av img{width:100%;height:100%;object-fit:cover;}
.av.enroute{border-color:#EF9F27;background:#FAEEDA;}
.av.done{border-color:#97C459;background:#EAF3DE;color:#27500A;}
.av.absent{border-color:#94A3B8;background:#F1F5F9;color:#64748B;}
.sname{font-size:16px;font-weight:600;color:#1a1a1a;}
.sstatus{font-size:12px;color:#888;margin-top:2px;display:flex;align-items:center;gap:5px;}
.sstatus.enroute{color:#633806;font-weight:500;}
.sstatus.done{color:#27500A;font-weight:600;}

.school-chip{display:inline-flex;align-items:center;gap:4px;background:#F0F4FF;border:1px solid #C7D7FF;border-radius:6px;padding:2px 8px;font-size:11px;color:#3451B2;}

.instr-name{font-size:11px;color:#7A2800;font-weight:600;}

.btn-action{flex:1;padding:11px;border-radius:8px;border:1px solid #F4A27C;background:#FEE8DC;color:#7A2800;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-enroute{border-color:#EF9F27;background:#FAEEDA;color:#633806;}
.btn-picked{border-color:#97C459;background:#EAF3DE;color:#27500A;}
.btn-absent{border-color:#94A3B8;background:#F1F5F9;color:#475569;font-size:12px;}

.absent-note{margin:0 14px 12px;}
.absent-note-label{font-size:11px;color:#64748B;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.absent-input{width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;color:#1a1a1a;resize:none;outline:none;background:#F8FAFC;}
.absent-actions{display:flex;gap:6px;margin-top:6px;}
.btn-absent-send{flex:1;background:#475569;border:none;color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.post-pickup{padding:0 14px 12px;}
.note-row-wrap{display:flex;gap:8px;align-items:stretch;}
.btn-note-main{flex:1;background:#F1F5F9;border:1px solid #CBD5E1;color:#475569;font-size:13px;font-weight:600;border-radius:8px;padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;}
.btn-urgent-icon{flex-shrink:0;width:42px;height:42px;border-radius:8px;background:#FCEBEB;border:1px solid #E89999;color:#A32D2D;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;}

.note-form{display:flex;flex-direction:column;gap:6px;}
.note-input{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;color:#1a1a1a;resize:none;outline:none;}
.note-row{display:flex;gap:6px;}
.btn-note-send{flex:1;background:#F4600C;border:none;color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;padding:20px 20px 36px;}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px;}
.sheet-title{font-size:16px;font-weight:600;color:#C0392B;margin-bottom:4px;}
.sheet-title.neutral{color:#1a1a1a;}
.sheet-sub{font-size:13px;color:#888;margin-bottom:14px;}
.sheet-input{width:100%;border:1px solid #FFBDBD;border-radius:10px;padding:12px;font-size:14px;font-family:inherit;color:#1a1a1a;resize:none;outline:none;min-height:80px;background:#FFF5F5;}
.sheet-actions{display:flex;gap:8px;margin-top:12px;}
.btn-urgent-send{flex:1;background:#C0392B;border:none;color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;}

.btn-sheet-cancel{background:#f5f5f5;border:none;color:#888;border-radius:10px;padding:13px 18px;font-size:14px;cursor:pointer;}
.offline-bar{background:#FAEEDA;border-bottom:1px solid #F4A27C;padding:6px 16px;font-size:11px;color:#633806;display:flex;align-items:center;gap:6px;}
.loading{padding:60px 16px;text-align:center;}
.spin{display:inline-block;width:28px;height:28px;border:3px solid #FEE8DC;border-top-color:#F4600C;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-t{font-size:14px;color:#888;}
.hidden-camera{display:none;}
</style>

<body>
<div class="app" id="app">
<div class="loading"><div class="spin"></div><div class="loading-t">Loading today's roster…</div></div>
</div>

<input type="file" accept="image/*" capture="environment" id="cameraInput" class="hidden-camera" onchange="handlePhotoTaken(event)">

<div class="sheet-overlay" id="photoSheetOverlay" style="display:none" onclick="closePhotoSheet(event)">
<div class="sheet">
<div class="sheet-handle"></div>
<div class="sheet-title neutral">Send without photo?</div>
<div class="sheet-sub" id="photoSheetSub">No photo was taken. You can still send the parent a text confirming pickup.</div>
<div class="sheet-actions">
<button class="btn-sheet-cancel" onclick="closePhotoSheetCancel()">Cancel</button>
<button class="btn-sheet-confirm" onclick="sendWithoutPhoto()">Send without photo</button>
</div>
</div>
</div>

<div class="sheet-overlay" id="urgentOverlay" style="display:none" onclick="closeUrgent(event)">
<div class="sheet">
<div class="sheet-handle"></div>
<div class="sheet-title">🚨 Urgent alert</div>
<div class="sheet-sub" id="urgentSub"></div>
<textarea class="sheet-input" id="urgentText" placeholder="Describe what's happening so the team can act immediately…"></textarea>
<div class="sheet-actions">
<button class="btn-sheet-cancel" onclick="closeUrgentSheet()">Cancel</button>
<button class="btn-urgent-send" onclick="sendUrgent()">Send alert now</button>
</div>
</div>
</div>

<script>
const TODAY=new Date();
const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const todayFull=DAYS_FULL[TODAY.getDay()];
const todayShort=DAYS_SHORT[TODAY.getDay()];
const todayStr=`${MONTHS[TODAY.getMonth()]} ${TODAY.getDate()}`;
const CACHE_KEY=`tac_roster_${TODAY.toDateString()}`;
const STATE_KEY=`tac_states_${TODAY.toDateString()}`;

'Janet Chow':'https://v5.airtableusercontent.com/v3/u/53/53/1779256800000/g_lKIPiMbgJJEQ1ebMNo4w/YfwuBSihBcBxvoamth7AgwNpcqe0p33zUa9qhMqPS41GizC-0XI2CLW4DrxgU1XdkT1gv2TtJVnDg1U2WW6KDyYwaLtQKRl1qSK2ro-0zOUJmdH1bfU1tVHAueySfHIyZsDSXWvcxsLNtJVk1VJpwQ/l0NUBS-nBa-Ecu-e74DG7Z5_87PMCLKfby0oHLrBTI8',
'Ricky':'https://v5.airtableusercontent.com/v3/u/53/53/1779256800000/nPwkTwnGBYd94bd75l9TMw/Rsva16-LVXbkCcngRZPWlwbRbxaB4ye2H2lkA_R7mKijkt15nNBsXxlaa01IMjn7lz1c3nGp7BGdCv9apHnmeyWjMSzm7tHWjec7mWfsPkNYm6yswn8ev9z8-iRU-9MhMvQri2VKBxR4wrhqg5Icxw/u3AWjmHDERyvuWHfZsY0m73UrQar-kyR82ifJ3UFkQk',
"Regina D'Soto":'https://v5.airtableusercontent.com/v3/u/53/53/1779256800000/LigiIrDMV63tpUsPQINRIA/3cjWxamjs0KzIg9G_avb1LmXJ9XXC72LKomR4sIncrraXQLmeJF6MSFAv3etRBoPWXHUBSExFfzVRXZMt2LMl5O_1xbMQtVi_5Q9Q4_Rsd_v3pSTi-n1MCcPNgndzevJAdqx13G0vxFzn66SKCm7_Q/J5vt7DoVAfmd21aNwykB_NEZ7jeJgED5adcPHe_6Bjg',
'Teresa':'https://v5.airtableusercontent.com/v3/u/53/53/1779256800000/u5Ju62g0GMUWTQ6321YFVw/pQwRu5sMs2YKezjwuIphmuvA9gHzLgSosRDaR-qhhIT-5pOCqje87GMDsKlDky_vm1TKQiQAnHXeZ_XzvYxD3jJxh_4y2lF5iXxubc1utg5B_ERmJIfGjSHLyz-AdkHbatqQDXdLveH2ZVl9XPCeLw/nsY6z6JZ7atKh3t3PHEDtaBCrM7Z1iOdoS7PY7PElDc',

};

let students=[],changes=[],activeFilter='all',isOffline=false,urgentStudentId=null;
let pickupContext=null; // tracks which student we're in the "child picked up" flow for
let {states,absentNotes,teamNotes,pickupTimes}=loadState();
if(!pickupTimes)pickupTimes={};

function loadState(){try{const s=localStorage.getItem(STATE_KEY);return s?JSON.parse(s):{states:{},absentNotes:{},teamNotes:{},pickupTimes:{}};}catch(e){return{states:{},absentNotes:{},teamNotes:{},pickupTimes:{}};}}
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify({states,absentNotes,teamNotes,pickupTimes}));}catch(e){}}
function initials(n){return(n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function normDay(d){const s=(d||'').toLowerCase();if(s.startsWith('mo'))return'mon';if(s.startsWith('tu'))return'tue';if(s.startsWith('we'))return'wed';if(s.startsWith('th'))return'thu';if(s.startsWith('fr'))return'fri';return s.slice(0,3);}
function parseSecondary(n){if(!n)return null;const m=n.match(/Also text[^\d]*?([\w\s]+?)\s+at\s+([\d\-\(\)\s]+)/i);if(!m)return null;return{name:m[1].trim().replace(/^(Dad|Mom|dad|mom)\s+/,''),phone:m[2].trim()};}

function mapStudent(r, staff, t) {
const f = r.fields || {};
const rawDays = f['Enrolled Days'] || [];
const studentDays = rawDays.map(d => normDay(d.name || d));
const photos = f['Photo'] || [];
const pickupLocs = f['Default Pickup Location'] || [];
const matchedInstr = staff.find(st => {
const sf = st.fields || {};
const sd = (sf['Default Availability'] || []).map(d => normDay(d.name || d));
return sd.includes(t) && studentDays.includes(t);
});
return {
id: r.id,
name: f['Name'] || 'Unknown',
status: (f['Status']?.name || f['Status'] || 'Active'),
days: rawDays,
photo: photos[0]?.thumbnails?.small?.url || photos[0]?.url || null,
pickupPhone: f['Pickup Contact Phone'] || '',
pickupName: f['Pickup Contact Name'] || '',
notes: f['Notes (Nice to Know)'] || '',
teacher: f['Homeroom Teacher'] || '',
grade: f['Grade']?.name || f['Grade'] || '',
school: f['School']?.name || f['School'] || '',
pickupLocation: pickupLocs[0]?.name || '',
instrName: matchedInstr?.fields?.['Name'] || '',
instrDays: matchedInstr?.fields?.['Default Availability'] || [],
};
}

function todayList(){
const t=normDay(todayShort);
let list=students.filter(s=>{
const days=(s.days||[]).map(d=>normDay(d.name||d));
return days.includes(t)&&(s.status||'').toLowerCase().includes('active');
});
if(activeFilter!=='all')list=list.filter(s=>s.instrName===activeFilter);
return list;
}

function getInstructors(){
const t=normDay(todayShort);
return students.filter(s=>s.instrName&&(s.instrDays||[]).map(d=>normDay(d.name||d)).includes(t)).map(s=>s.instrName).filter((v,i,a)=>a.indexOf(v)===i).sort();
}

// ============================================================
//  STATE-CHANGE FLOW (new)
// ============================================================

// Called when instructor taps "En route to pickup"
function startEnroute(id){
const s=students.find(x=>x.id===id);
if(!s)return;
states[id]='enroute';
saveState();
render();
// Open phone's text app with the "on the way" message
openParentText(s,'enroute');
}

// Called when instructor taps "Child picked up"
function startPickup(id){
const s=students.find(x=>x.id===id);
if(!s)return;
pickupContext={studentId:id,studentName:s.name,phone:s.pickupPhone,parentName:s.pickupName};
// Open the camera
document.getElementById('cameraInput').click();
}

// Called when a photo is taken OR the camera was cancelled
function handlePhotoTaken(event){
const file=event.target.files && event.target.files[0];
event.target.value=''; // reset so the same input works next time
if(!file){
// User cancelled the camera, ask if they want to send without photo
showPhotoSheet();
return;
}
// They took a photo. Mark as done, open text app, parent will manually attach photo.
finishPickup(true);
}

function showPhotoSheet(){
document.getElementById('photoSheetSub').textContent=`No photo was taken for ${pickupContext?.studentName||'this child'}. You can still send the parent a text confirming pickup.`;
document.getElementById('photoSheetOverlay').style.display='flex';
}

function closePhotoSheet(e){if(e.target.id==='photoSheetOverlay')closePhotoSheetCancel();}

function closePhotoSheetCancel(){
document.getElementById('photoSheetOverlay').style.display='none';
// Cancel the pickup, return to enroute state
pickupContext=null;
}

function sendWithoutPhoto(){
document.getElementById('photoSheetOverlay').style.display='none';
finishPickup(false);
}

function finishPickup(withPhoto){
if(!pickupContext)return;
const s=students.find(x=>x.id===pickupContext.studentId);
states[pickupContext.studentId]='done';
pickupTimes[pickupContext.studentId]=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
saveState();
render();
if(s)openParentText(s,'done',withPhoto);
pickupContext=null;
}

function openParentText(s,type,withPhoto){
const parentFirst=(s.pickupName||'').split(' ')[0];
const greeting=parentFirst?`Hi ${parentFirst}!`:'Hi there!';
let body;
const firstName=(s.name||'').split(' ')[0];
if(type==='enroute'){
body=`${greeting} This is your instructor from The Afterschool Collective. I'm on my way to pick up ${firstName} right now. See you soon!`;
}else{
body=withPhoto
?`${greeting} ${firstName} has been safely picked up and is on the way back to the studio.`
:`${greeting} ${firstName} has been safely picked up and is on the way back to the studio. See you at pickup time!`;
}
const phone=(s.pickupPhone||'').replace(/\D/g,'');
window.open((phone?`sms:${phone}`:'sms:')+`?body=${encodeURIComponent(body)}`,'_self');
}

// ============================================================
//  EXISTING ABSENT / NOTE / URGENT (unchanged behavior)
// ============================================================

function setAbsent(id){
states[id]='absent';
absentNotes[id]=absentNotes[id]||{open:true,sent:false};
saveState();
render();
}

function setFilter(f){activeFilter=f;render();}
function toggleTeamNote(id){teamNotes[id]=teamNotes[id]||{};teamNotes[id].open=!teamNotes[id].open;saveState();render();}

async function sendAbsentNote(id){
const s=students.find(x=>x.id===id);
const el=document.getElementById(`absent-${id}`);
const text=el?el.value.trim():'';
if(!text)return;
absentNotes[id]={sent:true,open:false};saveState();render();
await proxy('logIncident',{description:`ABSENT — ${s?.name||id}: ${text} [${todayStr}]`,type:'Field Note',severity:'Low'});
}

async function sendTeamNote(id){
const s=students.find(x=>x.id===id);
const el=document.getElementById(`note-${id}`);
const text=el?el.value.trim():'';
if(!text)return;
teamNotes[id]={sent:true,open:false};saveState();render();
await proxy('logIncident',{description:`${text} [Student: ${s?.name||id}, Date: ${todayStr}]`,type:'Field Note',severity:'Low'});
}

function openUrgent(id){
const s=students.find(x=>x.id===id);
urgentStudentId=id;
document.getElementById('urgentSub').textContent=`Student: ${s?.name||''}`;
document.getElementById('urgentText').value='';
document.getElementById('urgentOverlay').style.display='flex';
}

function closeUrgent(e){if(e.target.id==='urgentOverlay')closeUrgentSheet();}
function closeUrgentSheet(){document.getElementById('urgentOverlay').style.display='none';urgentStudentId=null;}

async function sendUrgent(){
const text=document.getElementById('urgentText').value.trim();
const s=students.find(x=>x.id===urgentStudentId);
closeUrgentSheet();
const msg=`🚨 URGENT — ${s?.name||'Student'} situation at pickup. ${text} [${todayStr}]`;
window.open(`sms:${REBECCA_PHONE}?body=${encodeURIComponent(msg)}`,'_self');
await proxy('logIncident',{description:msg,type:'Missing Student',severity:'High'});
}

function saveCache(data){try{sessionStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),data}));}catch(e){}}
function loadCache(){try{const c=sessionStorage.getItem(CACHE_KEY);if(c){const p=JSON.parse(c);if(Date.now()-p.ts<8*3600000)return p.data;}}catch(e){}return null;}

async function proxy(action,extra={}){
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
return r.json();
}

// ============================================================
//  RENDER
// ============================================================

function render(){
const list=todayList();
const allToday=students.filter(s=>{const t=normDay(todayShort);const days=(s.days||[]).map(d=>normDay(d.name||d));return days.includes(t)&&(s.status||'').toLowerCase().includes('active');});
const doneCount=Object.values(states).filter(s=>s==='done').length;
const absentCount=Object.values(states).filter(s=>s==='absent').length;
const todayChanges=changes.filter(c=>(c.fields||{})['Change Summary']);
const instructors=getInstructors();
document.getElementById('app').innerHTML=`
${isOffline?`<div class="offline-bar"><i class="ti ti-wifi-off"></i> Offline — showing cached roster</div>`:''}
<div class="header"><div><div class="brand-name">AFTERSCHOOL</div><div class="brand-sub">Collective</div><div class="brand-tag">Pickup — ${todayStr}</div></div><div class="day-pill">${todayFull}</div></div>
<div class="stats">
<div class="stat"><div class="stat-n">${allToday.length}</div><div class="stat-l">Expected</div></div>
<div class="stat"><div class="stat-n green">${doneCount}</div><div class="stat-l">Picked up</div></div>
<div class="stat"><div class="stat-n ${absentCount>0?'red':''}">${absentCount}</div><div class="stat-l">Absent</div></div>
</div>
${todayChanges.length?`<div class="alert-box" style="margin:12px 16px 0"><div class="alert-hdr"><i class="ti ti-alert-triangle" style="font-size:16px;color:#A32D2D"></i><span class="alert-hdr-text">Changes today, read first</span></div>${todayChanges.map(c=>`<div class="alert-item"><div class="alert-name">${(c.fields||{})['Change Summary']||'Change logged'}</div></div>`).join('')}</div>`:`<div class="clear-bar"><i class="ti ti-circle-check" style="font-size:16px;color:#27500A"></i><span class="clear-text">All clear, no changes today</span></div>`}
${instructors.length>1?`<div class="filter-bar"><button class="filter-pill${activeFilter==='all'?' active':''}" onclick="setFilter('all')"><i class="ti ti-users" style="font-size:13px"></i> All</button>${instructors.map(name=>`<button class="filter-pill${activeFilter===name?' active':''}" onclick="setFilter('${name.replace(/'/g,"\\'")}')">${INSTRUCTOR_PHOTOS[name]?`<img src="${INSTRUCTOR_PHOTOS[name]}" alt="${name}" onerror="this.style.display='none'">`:''}${name.split(' ')[0]}</button>`).join('')}</div>`:'' }
<div class="section-hdr"><span class="section-title">${activeFilter==='all'?"Today's students":activeFilter.split(' ')[0]+"'s students"}</span><span class="count-chip">${list.length}</span></div>
<div class="cards">
${list.length===0?`<div style="text-align:center;padding:40px 0;color:#888;font-size:14px">No students enrolled for ${todayFull}</div>`:
list.map(s=>{
const st=states[s.id]||'pending';
const secondary=parseSecondary(s.notes);
const instrPhoto=INSTRUCTOR_PHOTOS[s.instrName]||null;
const an=absentNotes[s.id]||{};
const tn=teamNotes[s.id]||{};
const now=new Date();
const timeStr=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const collapsed = st==='done' || (st==='absent' && an.sent);
return`<div class="card ${st}" id="c-${s.id}">
<div class="card-accent ${st}"></div>
<div class="card-top" style="${collapsed?'padding-bottom:6px':''}">
<div class="av ${st}${collapsed?' small':''}">${s.photo?`<img src="${s.photo}" alt="${s.name}" onerror="this.style.display='none';this.parentNode.textContent='${initials(s.name)}'">`:initials(s.name)}</div>
<div style="flex:1;min-width:0">
<div class="sname" style="${collapsed?'font-size:15px':''}">${s.name}</div>
<div class="sstatus ${st}">${st==='done'?`<i class="ti ti-circle-check" style="font-size:14px;color:#27500A"></i>`:`<div class="sdot ${st}"></div>`}${st==='pending'?'Not started yet':st==='enroute'?'En route to pickup':st==='absent'?(an.sent?'Marked absent, note sent':'Marked absent'):`Picked up${pickupTimes[s.id]?' at '+pickupTimes[s.id]:''}`}</div>
${collapsed?(s.school?`<div style="margin-top:3px"><div class="school-chip"><i class="ti ti-building" style="font-size:11px"></i>${s.school}</div></div>`:''):`<div class="info-row">
${s.pickupLocation?`<div class="location-chip"><i class="ti ti-map-pin" style="font-size:11px"></i>${s.pickupLocation}</div>`:''}
${s.school?`<div class="school-chip"><i class="ti ti-building" style="font-size:11px"></i>${s.school}</div>`:''}
</div>
${s.teacher?`<div class="teacher-line">${s.teacher}${s.grade?' · '+s.grade:''}</div>`:''}`}
</div>
${instrPhoto&&activeFilter==='all'&&!collapsed?`<div class="instr-chip"><img src="${instrPhoto}" class="instr-photo" alt="${s.instrName||''}" onerror="this.style.display='none'"><span class="instr-name">${(s.instrName||'').split(' ')[0]}</span></div>`:''}
</div>
${(st!=='absent' && !collapsed)?`<div class="parent-row"><div class="parent-contacts">
<div class="parent-contact"><div><div class="parent-name">${s.pickupName||'Parent'}</div>${s.pickupPhone?`<div class="parent-phone">${s.pickupPhone}</div>`:`<div class="no-phone">Awaiting welcome email reply</div>`}</div></div>
${secondary?`<div class="parent-contact"><div><div class="parent-name">${secondary.name}</div><div class="parent-phone">${secondary.phone}</div></div></div>`:''}
</div></div>`:''}
${!collapsed?`<div class="card-actions">
${st==='pending'?`<button class="btn-action btn-enroute" onclick="startEnroute('${s.id}')"><i class="ti ti-walk" style="font-size:15px"></i>En route to pickup</button>`
:st==='enroute'?`<button class="btn-action btn-picked" onclick="startPickup('${s.id}')"><i class="ti ti-camera" style="font-size:15px"></i>Child picked up</button><button class="btn-action btn-absent" onclick="setAbsent('${s.id}')" style="max-width:110px"><i class="ti ti-user-x" style="font-size:14px"></i>Not there</button>`
:''}
</div>`:''}
${st==='absent'?(an.sent?`<div class="post-pickup"><div class="note-row-wrap"><button class="btn-note-main" onclick="toggleTeamNote('${s.id}')"><i class="ti ti-pencil" style="font-size:15px"></i> Add another note</button><button class="btn-urgent-icon" onclick="openUrgent('${s.id}')" aria-label="Send urgent alert"><i class="ti ti-alert-triangle"></i></button></div>${tn.open?`<div class="note-form" style="margin-top:8px"><textarea class="note-input" id="note-${s.id}" rows="2" placeholder="Additional note for the team"></textarea><div class="note-row"><button class="btn-note-cancel" onclick="toggleTeamNote('${s.id}')">Cancel</button><button class="btn-note-send" onclick="sendTeamNote('${s.id}')"><i class="ti ti-send" style="font-size:13px"></i> Send to team</button></div></div>`:''}${tn.sent?`<div class="note-sent" style="margin-top:6px"><i class="ti ti-circle-check" style="font-size:14px;color:#27500A"></i> Additional note sent</div>`:''}</div>`:`<div class="absent-note">
<div class="absent-note-label"><i class="ti ti-pencil" style="font-size:12px"></i> What happened?</div>
<textarea class="absent-input" id="absent-${s.id}" rows="2" placeholder="${s.name} was not at pickup at ${timeStr}. "></textarea><div class="note-row-wrap" style="margin-top:6px"><button class="btn-absent-send" onclick="sendAbsentNote('${s.id}')"><i class="ti ti-send" style="font-size:13px"></i> Send to team</button><button class="btn-urgent-icon" onclick="openUrgent('${s.id}')" aria-label="Send urgent alert"><i class="ti ti-alert-triangle"></i></button></div>
</div>`):''}
${st==='done'?`<div class="post-pickup">
${tn.sent?`<div class="note-sent-row"><span class="note-sent"><i class="ti ti-circle-check" style="font-size:14px;color:#27500A"></i> Note sent to the team</span><button class="btn-urgent-icon" onclick="openUrgent('${s.id}')" aria-label="Send urgent alert"><i class="ti ti-alert-triangle"></i></button></div>`:tn.open?`<div class="note-form"><textarea class="note-input" id="note-${s.id}" rows="2" placeholder="e.g. Bus arrived 10 min late at a new stop on 47th Ave"></textarea><div class="note-row"><button class="btn-note-cancel" onclick="toggleTeamNote('${s.id}')">Cancel</button><button class="btn-note-send" onclick="sendTeamNote('${s.id}')"><i class="ti ti-send" style="font-size:13px"></i> Send to team</button></div></div>`:`<div class="note-row-wrap"><button class="btn-note-main" onclick="toggleTeamNote('${s.id}')"><i class="ti ti-pencil" style="font-size:15px"></i> Leave a note for the team</button><button class="btn-urgent-icon" onclick="openUrgent('${s.id}')" aria-label="Send urgent alert"><i class="ti ti-alert-triangle"></i></button></div>`}
</div>`:''}
</div>`;
}).join('')}
</div>`;
}

async function init(){
const cached=loadCache();
if(cached){students=cached.students;changes=cached.changes;isOffline=false;render();}
try{
const t=normDay(todayShort);
const [sd,stf,cd]=await Promise.all([proxy('getStudents'),proxy('getStaff'),proxy('getChanges')]);
const staff=(stf.records||[]).filter(r=>(r.fields?.['Status']?.name||r.fields?.['Status']||'').toLowerCase().includes('active'));
students=(sd.records||[]).map(r=>mapStudent(r,staff,t));
changes=cd.records||[];
saveCache({students,changes});
isOffline=false;
}catch(e){
if(!cached){isOffline=true;students=[];changes=[];}
else isOffline=true;
}
render();
}

init();
</script>
</body>
</html>
